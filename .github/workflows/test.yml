name: Application checks
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx
      - name: Run tests
        env:
          SECRET_KEY: github-actions-test-only-long-random-like-secret-12345
          DATABASE_PATH: data/ci.sqlite3
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check live diagnostics behavior
        run: node --test tests/device_live_refresh.cjs
  browser-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install application and browser test dependencies
        run: |
          python -m pip install -r requirements.txt
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Check login, imports, activities and responsive layouts
        env:
          TEST_PYTHON: python
        run: node tests/browser_smoke.cjs
      - name: Save fictional-data design previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncsc-design-previews
          path: docs/*-preview.png
          retention-days: 7
