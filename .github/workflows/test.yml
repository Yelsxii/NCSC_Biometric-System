name: Python tests
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx
      - name: Run tests
        env:
          SECRET_KEY: github-actions-test-only-long-random-like-secret-12345
          DATABASE_PATH: data/ci.sqlite3
        run: python -m pytest -q
